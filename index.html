<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vox Populi — Democratic Voting Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --ink: #0a0a0f;
  --paper: #f5f3ee;
  --cream: #ede9e0;
  --gold: #c9a84c;
  --gold-light: #e8d5a3;
  --gold-dark: #8a6c28;
  --crimson: #b5192d;
  --crimson-light: #e8cdd0;
  --cobalt: #1a3a6e;
  --cobalt-light: #d0daf0;
  --emerald: #1a5c3a;
  --emerald-light: #c5e0d0;
  --surface: #ffffff;
  --surface2: #f9f7f3;
  --border: rgba(10,10,15,0.12);
  --border-strong: rgba(10,10,15,0.25);
  --text: #0a0a0f;
  --text-2: #4a4845;
  --text-3: #8a8780;
  --shadow-sm: 0 2px 8px rgba(10,10,15,0.08);
  --shadow-md: 0 8px 32px rgba(10,10,15,0.12);
  --shadow-lg: 0 24px 64px rgba(10,10,15,0.16);
  --r: 12px;
  --r-lg: 20px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Syne', sans-serif;
  background: var(--paper);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}


::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--cream); }
::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }


.serif { font-family: 'Cormorant Garamond', serif; }
.mono  { font-family: 'JetBrains Mono', monospace; }
h1,h2,h3,h4 { font-family: 'Cormorant Garamond', serif; font-weight: 700; line-height: 1.15; }


.app { display: flex; flex-direction: column; min-height: 100vh; }

.header {
  background: var(--ink);
  padding: 0 2rem;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  border-bottom: 1px solid rgba(201,168,76,0.3);
}
.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-icon {
  width: 32px; height: 32px;
  background: var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
  font-size: 16px;
}
.header-right { display: flex; align-items: center; gap: 12px; }
.notif-btn {
  position: relative;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: rgba(255,255,255,0.7);
  font-size: 16px;
  transition: all 0.2s;
}
.notif-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
.notif-badge {
  position: absolute;
  top: -3px; right: -3px;
  background: var(--crimson);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  min-width: 16px; height: 16px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif;
}
.user-pill {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 30px;
  padding: 6px 14px 6px 6px;
  cursor: pointer;
  transition: all 0.2s;
}
.user-pill:hover { background: rgba(255,255,255,0.14); }
.user-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--crimson));
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.user-avatar.lg { width: 52px; height: 52px; font-size: 18px; }
.user-avatar.xl { width: 80px; height: 80px; font-size: 28px; }
.user-name { font-size: 13px; font-weight: 600; color: #fff; }
.role-tag {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border-radius: 20px;
}
.role-admin { background: rgba(181,25,45,0.25); color: #ff8a96; border: 1px solid rgba(181,25,45,0.4); }
.role-voter { background: rgba(201,168,76,0.2); color: var(--gold-light); border: 1px solid rgba(201,168,76,0.3); }


.layout { display: flex; min-height: calc(100vh - 68px); }
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  position: sticky;
  top: 68px;
  height: calc(100vh - 68px);
  overflow-y: auto;
}
.sidebar-section { padding: 0 1rem; margin-bottom: 1.5rem; }
.sidebar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-3); padding: 0 0.75rem; margin-bottom: 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  border-radius: var(--r);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  transition: all 0.18s;
  margin-bottom: 2px;
}
.nav-item:hover { background: var(--cream); color: var(--text); }
.nav-item.active { background: var(--ink); color: #fff; }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.nav-count { margin-left: auto; background: var(--gold); color: var(--ink); font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }


.content { flex: 1; padding: 2rem; max-width: 1000px; }
.content.full { max-width: none; }

/* ── Page hero ── */
.page-hero { margin-bottom: 2rem; }
.page-hero h1 { font-size: 2.8rem; line-height: 1; margin-bottom: 8px; }
.page-hero p { color: var(--text-2); font-size: 15px; font-weight: 400; }

/* ── Buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border: none; border-radius: var(--r);
  font-family: 'Syne', sans-serif;
  font-weight: 600; cursor: pointer;
  transition: all 0.2s; white-space: nowrap;
}
.btn-gold { background: var(--gold); color: var(--ink); padding: 11px 22px; font-size: 14px; }
.btn-gold:hover { background: var(--gold-dark); color: #fff; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,168,76,0.4); }
.btn-ink { background: var(--ink); color: #fff; padding: 11px 22px; font-size: 14px; }
.btn-ink:hover { background: #1a1a25; transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--text); padding: 10px 20px; font-size: 14px; border: 1.5px solid var(--border-strong); }
.btn-outline:hover { border-color: var(--gold); color: var(--gold-dark); }
.btn-ghost { background: transparent; color: var(--text-2); padding: 9px 16px; font-size: 13px; }
.btn-ghost:hover { background: var(--cream); color: var(--text); }
.btn-crimson { background: var(--crimson); color: #fff; padding: 9px 18px; font-size: 13px; }
.btn-crimson:hover { background: #8a1020; transform: translateY(-1px); }
.btn-sm { padding: 7px 14px !important; font-size: 12px !important; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
.btn-full { width: 100%; }

/* ── Stats strip ── */
.stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 1.25rem 1.5rem;
  position: relative;
  overflow: hidden;
}
.stat-tile::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.stat-tile.gold::before { background: var(--gold); }
.stat-tile.crimson::before { background: var(--crimson); }
.stat-tile.cobalt::before { background: var(--cobalt); }
.stat-tile.emerald::before { background: var(--emerald); }
.stat-number { font-family: 'Cormorant Garamond', serif; font-size: 2.6rem; font-weight: 700; line-height: 1; margin-bottom: 4px; }
.stat-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); }
.stat-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; }

/* ── Election cards ── */
.elections-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
.e-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  transition: all 0.25s;
  cursor: pointer;
  position: relative;
}
.e-card:hover { border-color: var(--gold); box-shadow: var(--shadow-md); transform: translateY(-2px); }
.e-card.voted { border-color: var(--emerald); }
.e-card.featured { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(201,168,76,0.2); }
.e-card-banner {
  height: 8px;
}
.e-card-banner.active { background: linear-gradient(90deg, var(--emerald), #2a9d5c); }
.e-card-banner.ended { background: var(--cream); }
.e-card-banner.upcoming { background: linear-gradient(90deg, var(--cobalt), #2a5cbf); }
.e-card-body { padding: 1.25rem; }
.e-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.e-card-title { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 700; line-height: 1.2; }
.badge {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
  padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.badge-active { background: var(--emerald-light); color: var(--emerald); }
.badge-ended { background: var(--cream); color: var(--text-3); }
.badge-upcoming { background: var(--cobalt-light); color: var(--cobalt); }
.badge-voted { background: var(--emerald-light); color: var(--emerald); }
.badge-featured { background: rgba(201,168,76,0.2); color: var(--gold-dark); }
.badge-crimson { background: var(--crimson-light); color: var(--crimson); }
.e-card-desc { font-size: 13px; color: var(--text-2); line-height: 1.5; margin-bottom: 12px; }
.e-card-meta { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.e-card-meta span { display: flex; align-items: center; gap: 4px; }
.e-card-candidates { display: flex; gap: -8px; margin-top: 10px; }
.cand-mini-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: #fff;
  margin-right: -8px;
}
.progress-mini { height: 4px; background: var(--cream); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.progress-mini-fill { height: 100%; border-radius: 2px; background: var(--gold); transition: width 0.6s ease; }
.tags-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.tag { font-size: 11px; background: var(--cream); color: var(--text-2); padding: 3px 9px; border-radius: 20px; }

/* ── Search & Filter bar ── */
.filter-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 200px; }
.search-wrap input { width: 100%; padding: 10px 14px 10px 40px; border: 1.5px solid var(--border); border-radius: var(--r); background: var(--surface); font-family: 'Syne', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border 0.2s; }
.search-wrap input:focus { border-color: var(--gold); }
.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 16px; }
.filter-select { border: 1.5px solid var(--border); border-radius: var(--r); padding: 10px 14px; background: var(--surface); font-family: 'Syne', sans-serif; font-size: 13px; color: var(--text); outline: none; cursor: pointer; }
.filter-select:focus { border-color: var(--gold); }
.chip-filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text-2);
  cursor: pointer; transition: all 0.18s;
}
.chip:hover { border-color: var(--gold-dark); color: var(--gold-dark); }
.chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }

/* ── Election Detail ── */
.e-detail { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.e-detail-header { margin-bottom: 2rem; }
.e-detail-title { font-size: 3rem; line-height: 1.05; margin-bottom: 12px; }
.e-detail-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 1rem; }
.meta-chip { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); background: var(--cream); padding: 6px 12px; border-radius: 20px; }

/* ── Candidate cards ── */
.candidates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.cand-card {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  padding: 1.5rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.cand-card:hover { border-color: var(--gold); box-shadow: var(--shadow-sm); }
.cand-card.selected { border-color: var(--gold); background: rgba(201,168,76,0.06); box-shadow: 0 0 0 3px rgba(201,168,76,0.2); }
.cand-card.winner { border-color: var(--emerald); }
.cand-avatar-lg {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: #fff;
  margin: 0 auto 12px;
}
.cand-name { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
.cand-party { font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
.cand-bio { font-size: 12px; color: var(--text-2); line-height: 1.4; margin-bottom: 10px; }
.cand-votes { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 500; color: var(--gold-dark); }
.cand-pct { font-size: 12px; color: var(--text-3); }
.selected-check {
  position: absolute; top: 10px; right: 10px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--gold); color: var(--ink);
  display: none; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.cand-card.selected .selected-check { display: flex; }
.winner-crown {
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  font-size: 20px;
}

/* ── Results bars ── */
.results-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 2rem; }
.result-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
.result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.result-name { font-weight: 600; font-size: 15px; }
.result-stats { display: flex; gap: 12px; font-size: 13px; color: var(--text-2); }
.result-votes { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
.result-pct { color: var(--text-3); }
.result-bar-bg { height: 8px; background: var(--cream); border-radius: 4px; overflow: hidden; }
.result-bar { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
.bar-gold { background: linear-gradient(90deg, var(--gold-dark), var(--gold)); }
.bar-cobalt { background: linear-gradient(90deg, var(--cobalt), #4a7fe0); }
.bar-crimson { background: linear-gradient(90deg, var(--crimson), #e84060); }
.bar-emerald { background: linear-gradient(90deg, var(--emerald), #2ab56a); }
.bar-gray { background: linear-gradient(90deg, #888, #aaa); }

/* ── Comments ── */
.comment-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; margin-top: 2rem; }
.comment-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 15px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.comment-input-wrap { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-start; }
.comment-input { flex: 1; border: 1.5px solid var(--border); border-radius: var(--r); padding: 10px 14px; font-family: 'Syne', sans-serif; font-size: 14px; color: var(--text); background: var(--surface2); outline: none; resize: none; }
.comment-input:focus { border-color: var(--gold); }
.comment-list { padding: 0.5rem 0; }
.comment-item { padding: 12px 1.25rem; display: flex; gap: 10px; border-bottom: 1px solid var(--border); animation: fadeIn 0.25s ease; }
.comment-item:last-child { border-bottom: none; }
.comment-body { flex: 1; }
.comment-meta { font-size: 12px; color: var(--text-3); margin-bottom: 5px; display: flex; gap: 10px; align-items: center; }
.comment-author { font-weight: 700; color: var(--text); font-size: 13px; }
.comment-text { font-size: 14px; color: var(--text-2); line-height: 1.5; }
.comment-actions { display: flex; gap: 10px; margin-top: 6px; }
.comment-action-btn { background: none; border: none; font-size: 12px; color: var(--text-3); cursor: pointer; display: flex; align-items: center; gap: 4px; transition: color 0.15s; }
.comment-action-btn:hover { color: var(--gold-dark); }
.comment-action-btn.liked { color: var(--crimson); }

/* ── Auth screens ── */
.auth-page { min-height: calc(100vh - 68px); display: flex; }
.auth-left {
  flex: 1; background: var(--ink);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  padding: 3rem; text-align: center;
}
.auth-left h2 { font-family: 'Cormorant Garamond', serif; font-size: 3rem; color: var(--gold); margin-bottom: 1rem; }
.auth-left p { color: rgba(255,255,255,0.5); font-size: 14px; line-height: 1.7; max-width: 320px; }
.auth-right { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; background: var(--paper); }
.auth-card { width: 100%; max-width: 420px; }
.auth-card h2 { font-size: 2rem; margin-bottom: 6px; }
.auth-card p { color: var(--text-2); font-size: 14px; margin-bottom: 2rem; }
.form-group { margin-bottom: 1.1rem; }
.form-group label { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-3); margin-bottom: 7px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 11px 14px;
  font-family: 'Syne', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border 0.2s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold); }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.error-box { background: var(--crimson-light); border: 1px solid rgba(181,25,45,0.3); color: var(--crimson); padding: 10px 14px; border-radius: var(--r); font-size: 13px; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
.success-box { background: var(--emerald-light); border: 1px solid rgba(26,92,58,0.3); color: var(--emerald); padding: 10px 14px; border-radius: var(--r); font-size: 13px; margin-bottom: 1rem; }
.auth-footer { text-align: center; margin-top: 1.5rem; font-size: 14px; color: var(--text-3); }
.auth-footer span { color: var(--gold-dark); font-weight: 600; cursor: pointer; }

/* ── Admin table ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); padding: 10px 14px; border-bottom: 2px solid var(--border); text-align: left; background: var(--surface2); }
.data-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--cream); }
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }

/* ── Profile ── */
.profile-hero {
  background: var(--ink);
  border-radius: var(--r-lg);
  padding: 2rem;
  margin-bottom: 1.5rem;
  display: flex; align-items: center; gap: 1.5rem;
  position: relative; overflow: hidden;
}
.profile-hero::before {
  content: '';
  position: absolute;
  top: -50%; right: -10%;
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(201,168,76,0.15) 0%, transparent 70%);
}
.profile-hero-info h2 { color: #fff; font-size: 1.8rem; margin-bottom: 4px; }

<div class="app" id="app">
  <header class="header" id="header">
    <div class="logo"><div class="logo-icon">V</div> Vox Populi</div>
    <div class="header-right" id="header-right"></div>
  </header>
  <div id="root"></div>
</div>
<div class="toast-wrap" id="toast-wrap"></div>

<script>
const API = 'http://localhost:5000/api';
let token = localStorage.getItem('vp_token');
let me = JSON.parse(localStorage.getItem('vp_user') || 'null');
let currentPage = 'home';
let selectedCandidate = {};
let notifOpen = false;

// ══════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
    ...opts
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.message || 'Error');
  return d;
}

function toast(msg, type = 'success') {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  el.className = `toast toast-${type}`;
  el.innerHTML = `<span>${icons[type]}</span> ${msg}`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(10px)'; el.style.transition = 'all 0.3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

function initials(name = '') { return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase(); }

function fmtDate(d) { return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
function fmtDateTime(d) { return new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }

function getStatus(e) {
  const now = new Date();
  if (new Date(e.startDate) > now) return 'upcoming';
  if (new Date(e.endDate) < now) return 'ended';
  return 'active';
}

function countdown(endDate) {
  const diff = new Date(endDate) - new Date();
  if (diff <= 0) return 'Ended';
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (d > 0) return `${d}d ${h}h left`;
  if (h > 0) return `${h}h ${m}m left`;
  return `${m}m left`;
}

const barColors = ['bar-gold', 'bar-cobalt', 'bar-crimson', 'bar-emerald', 'bar-gray'];
const avatarColors = ['#c9a84c', '#1a3a6e', '#b5192d', '#1a5c3a', '#4a4845', '#8a2ab5'];

function logout() {
  localStorage.removeItem('vp_token');
  localStorage.removeItem('vp_user');
  token = null; me = null;
  navigate('login');
}

function navigate(page, data = null) {
  currentPage = page;
  window._pageData = data;
  renderApp();
}



function renderApp() {
  if (!token || !me) { renderAuth('login'); return; }
  renderHeader();
  if (currentPage === 'home') renderHome();
  else if (currentPage === 'election') renderElectionDetail(window._pageData);
  else if (currentPage === 'profile') renderProfile();
  else if (currentPage === 'leaderboard') renderLeaderboard();
  else if (currentPage === 'admin') renderAdmin();
  else if (currentPage === 'admin-users') renderAdminUsers();
  else if (currentPage === 'admin-activity') renderAdminActivity();
  else if (currentPage === 'admin-create') renderAdminCreate();
  else if (currentPage === 'admin-elections') renderAdminElections();
}

function renderHeader() {
  document.getElementById('header-right').innerHTML = `
    <div class="notif-btn" onclick="toggleNotif()" title="Notifications">
      🔔 <span class="notif-badge" id="notif-badge" style="display:none">0</span>
    </div>
    <div class="user-pill" onclick="navigate('profile')">
      <div class="user-avatar">${initials(me.name)}</div>
      <span class="user-name">${me.name.split(' ')[0]}</span>
      <span class="role-tag role-${me.role}">${me.role}</span>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="logout()">Out</button>`;
  loadNotifications();
}

async function loadNotifications() {
  try {
    const notifs = await api('/notifications');
    const unread = notifs.filter(n => !n.read).length;
    const badge = document.getElementById('notif-badge');
    if (badge) { badge.textContent = unread; badge.style.display = unread > 0 ? 'flex' : 'none'; }
    window._notifs = notifs;
  } catch {}
}

function toggleNotif() {
  const existing = document.getElementById('notif-panel');
  if (existing) { existing.remove(); return; }
  const notifs = window._notifs || [];
  const panel = document.createElement('div');
  panel.id = 'notif-panel';
  panel.className = 'notif-panel';
  panel.innerHTML = `
    <div class="notif-header">
      <span>Notifications</span>
      <button class="btn btn-ghost btn-sm" onclick="markAllRead()">Mark all read</button>
    </div>
    ${notifs.length ? notifs.map(n => `
      <div class="notif-item ${n.read ? '' : 'unread'}">
        ${!n.read ? '<div class="notif-dot"></div>' : '<div style="width:8px"></div>'}
        <div><div>${n.message}</div><div class="text-xs text-muted mt-1">${fmtDateTime(n.createdAt)}</div></div>
      </div>`).join('') : '<div style="padding:2rem;text-align:center;color:var(--text-3)">No notifications</div>'}`;
  document.body.appendChild(panel);
  document.addEventListener('click', function handler(e) {
    if (!panel.contains(e.target) && !e.target.closest('.notif-btn')) { panel.remove(); document.removeEventListener('click', handler); }
  }, { once: false });
}

async function markAllRead() {
  try { await api('/notifications/read', { method: 'PUT' }); document.getElementById('notif-badge').style.display = 'none'; document.getElementById('notif-panel')?.remove(); }
  catch {}
}



function renderAuth(mode) {
  document.getElementById('root').innerHTML = `
    <div class="auth-page">
      <div class="auth-left">
        <div style="font-size:3rem;margin-bottom:1rem">⚖️</div>
        <h2>Vox Populi</h2>
        <p>The voice of the people. Secure, transparent, and democratic voting for everyone.</p>
        <div style="margin-top:2rem;display:flex;gap:1.5rem;color:rgba(255,255,255,0.4);font-size:13px">
          <span>🔒 Secure</span><span>🗳 One vote</span><span>📊 Live results</span>
        </div>
      </div>
      <div class="auth-right">
        <div class="auth-card">
          ${mode === 'login' ? loginForm() : registerForm()}
        </div>
      </div>
    </div>`;
}

function loginForm() {
  return `
    <h2>Welcome back</h2>
    <p>Sign in to cast your vote</p>
    <div id="auth-err"></div>
    <div class="form-group"><label>Email</label><input id="a-email" type="email" placeholder="you@example.com"/></div>
    <div class="form-group"><label>Password</label><input id="a-pass" type="password" placeholder="••••••••"/></div>
    <button class="btn btn-ink btn-full" style="margin-top:0.5rem" onclick="doLogin()">Sign In →</button>
    <div class="auth-footer">No account? <span onclick="renderAuth('register')">Create one</span></div>
    <div class="auth-footer" style="margin-top:8px;font-size:12px;color:var(--text-3)">
      Demo: admin@vox.com / admin123 &nbsp;|&nbsp; voter@vox.com / voter123
    </div>`;
}

function registerForm() {
  return `
    <h2>Create account</h2>
    <p>Join the democratic process</p>
    <div id="auth-err"></div>
    <div class="form-grid">
      <div class="form-group"><label>Full Name</label><input id="a-name" type="text" placeholder="Your name"/></div>
      <div class="form-group"><label>Role</label>
        <select id="a-role"><option value="voter">Voter</option><option value="admin">Admin</option></select>
      </div>
    </div>
    <div class="form-group"><label>Email</label><input id="a-email" type="email" placeholder="you@example.com"/></div>
    <div class="form-group"><label>Password</label><input id="a-pass" type="password" placeholder="Min 6 characters"/></div>
    <button class="btn btn-ink btn-full" style="margin-top:0.5rem" onclick="doRegister()">Create Account →</button>
    <div class="auth-footer">Have account? <span onclick="renderAuth('login')">Sign in</span></div>`;
}

async function doLogin() {
  const email = document.getElementById('a-email').value;
  const password = document.getElementById('a-pass').value;
  try {
    const d = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
    token = d.token; me = d.user;
    localStorage.setItem('vp_token', token);
    localStorage.setItem('vp_user', JSON.stringify(me));
    toast(`Welcome back, ${me.name.split(' ')[0]}!`);
    navigate('home');
  } catch(e) { document.getElementById('auth-err').innerHTML = `<div class="error-box">⚠ ${e.message}</div>`; }
}

async function doRegister() {
  const name = document.getElementById('a-name').value;
  const email = document.getElementById('a-email').value;
  const password = document.getElementById('a-pass').value;
  const role = document.getElementById('a-role').value;
  try {
    const d = await api('/auth/register', { method: 'POST', body: JSON.stringify({ name, email, password, role }) });
    token = d.token; me = d.user;
    localStorage.setItem('vp_token', token);
    localStorage.setItem('vp_user', JSON.stringify(me));
    toast('Account created! Welcome to Vox Populi.');
    navigate('home');
  } catch(e) { document.getElementById('auth-err').innerHTML = `<div class="error-box">⚠ ${e.message}</div>`; }
}

// ══════════════════════════════════════════════
//  HOME / ELECTIONS LIST
// ══════════════════════════════════════════════

async function renderHome() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="layout">
      ${sidebar()}
      <div class="content">
        <div class="page-hero">
          <h1 class="serif">Elections</h1>
          <p>Participate in active elections or view upcoming ones below.</p>
        </div>
        <div class="filter-bar">
          <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input placeholder="Search elections, candidates, tags..." id="search-input" oninput="debounceSearch()" />
          </div>
          <select class="filter-select" id="cat-filter" onchange="loadElections()">
            <option value="all">All Categories</option>
            <option value="political">Political</option>
            <option value="student">Student</option>
            <option value="corporate">Corporate</option>
            <option value="community">Community</option>
            <option value="sports">Sports</option>
            <option value="other">Other</option>
          </select>
          <select class="filter-select" id="sort-filter" onchange="loadElections()">
            <option value="-createdAt">Newest</option>
            <option value="endDate">Ending Soon</option>
            <option value="-viewCount">Most Viewed</option>
          </select>
        </div>
        <div class="chip-filters" style="margin-bottom:1.5rem">
          <div class="chip active" onclick="setStatus('all',this)">All</div>
          <div class="chip" onclick="setStatus('active',this)">🟢 Active</div>
          <div class="chip" onclick="setStatus('upcoming',this)">🔵 Upcoming</div>
          <div class="chip" onclick="setStatus('ended',this)">⚫ Ended</div>
          <div class="chip" onclick="setStatus('voted',this)">✓ Voted</div>
        </div>
        <div id="elections-list"><div class="loading-state"><div class="loading-spinner"></div><br>Loading elections...</div></div>
      </div>
    </div>`;
  await loadElections();
}

function sidebar() {
  const isAdmin = me?.role === 'admin';
  return `
    <nav class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Main</div>
        <div class="nav-item ${currentPage==='home'?'active':''}" onclick="navigate('home')"><span class="icon">🗳</span> Elections</div>
        <div class="nav-item ${currentPage==='leaderboard'?'active':''}" onclick="navigate('leaderboard')"><span class="icon">🏆</span> Leaderboard</div>
        <div class="nav-item ${currentPage==='profile'?'active':''}" onclick="navigate('profile')"><span class="icon">👤</span> Profile</div>
      </div>
      ${isAdmin ? `
      <div class="sidebar-section">
        <div class="sidebar-label">Admin</div>
        <div class="nav-item ${currentPage==='admin'?'active':''}" onclick="navigate('admin')"><span class="icon">📊</span> Dashboard</div>
        <div class="nav-item ${currentPage==='admin-create'?'active':''}" onclick="navigate('admin-create')"><span class="icon">➕</span> Create Election</div>
        <div class="nav-item ${currentPage==='admin-elections'?'active':''}" onclick="navigate('admin-elections')"><span class="icon">📋</span> Manage Elections</div>
        <div class="nav-item ${currentPage==='admin-users'?'active':''}" onclick="navigate('admin-users')"><span class="icon">👥</span> Users</div>
        <div class="nav-item ${currentPage==='admin-activity'?'active':''}" onclick="navigate('admin-activity')"><span class="icon">📜</span> Activity Log</div>
      </div>` : ''}
    </nav>`;
}

let statusFilter = 'all';
let searchTimer;
function setStatus(s, el) {
  statusFilter = s;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  loadElections();
}
function debounceSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(loadElections, 350); }

async function loadElections() {
  const search = document.getElementById('search-input')?.value || '';
  const category = document.getElementById('cat-filter')?.value || 'all';
  const sort = document.getElementById('sort-filter')?.value || '-createdAt';
  const params = new URLSearchParams({ category, sort });
  if (search) params.set('search', search);
  if (statusFilter !== 'all' && statusFilter !== 'voted') params.set('status', statusFilter);

  try {
    let elections = await api('/elections?' + params);
    if (statusFilter === 'voted') elections = elections.filter(e => e.hasVoted);
    renderElectionCards(elections);
  } catch(e) {
    document.getElementById('elections-list').innerHTML = `<div class="error-box">⚠ ${e.message}</div>`;
  }
}

function renderElectionCards(elections) {
  const el = document.getElementById('elections-list');
  if (!elections.length) {
    el.innerHTML = `<div class="empty-state"><span class="empty-icon">🗳️</span><h3>No elections found</h3><p>Try adjusting your filters.</p></div>`;
    return;
  }
  el.innerHTML = `<div class="elections-grid">${elections.map(e => electionCard(e)).join('')}</div>`;
}

function electionCard(e) {
  const status = getStatus(e);
  const total = e.candidates?.reduce((s, c) => s + c.votes, 0) || 0;
  const leader = e.candidates ? [...e.candidates].sort((a, b) => b.votes - a.votes)[0] : null;
  const leaderPct = leader && total > 0 ? ((leader.votes / total) * 100).toFixed(0) : 0;

  return `
    <div class="e-card ${e.hasVoted ? 'voted' : ''} ${e.featured ? 'featured' : ''}" onclick="navigate('election', '${e._id}')">
      <div class="e-card-banner ${status}"></div>
      <div class="e-card-body">
        <div class="e-card-top">
          <div class="e-card-title">${e.title}</div>
          <span class="badge badge-${e.hasVoted ? 'voted' : status}">${e.hasVoted ? '✓ Voted' : status}</span>
        </div>
        ${e.featured ? '<span class="badge badge-featured" style="margin-bottom:8px;display:inline-block">⭐ Featured</span>' : ''}
        <div class="e-card-desc">${(e.description || 'No description.').slice(0, 100)}${e.description?.length > 100 ? '...' : ''}</div>
        <div class="e-card-meta">
          <span>📅 ${fmtDate(e.startDate)}</span>
          <span>👥 ${e.candidates?.length || 0} candidates</span>
          <span>🗳 ${total} votes</span>
          ${status === 'active' ? `<span class="countdown">⏱ ${countdown(e.endDate)}</span>` : ''}
        </div>
        ${e.tags?.length ? `<div class="tags-row">${e.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
        ${total > 0 && leader ? `
          <div style="margin-top:10px">
            <div style="font-size:12px;color:var(--text-3);margin-bottom:4px">Leading: <strong style="color:var(--text-2)">${leader.name}</strong> (${leaderPct}%)</div>
            <div class="progress-mini"><div class="progress-mini-fill" style="width:${leaderPct}%"></div></div>
          </div>` : ''}
        <div style="display:flex;gap:-8px;margin-top:10px">
          ${(e.candidates || []).slice(0, 4).map((c, i) => `<div class="cand-mini-avatar" style="background:${avatarColors[i % avatarColors.length]}">${initials(c.name)}</div>`).join('')}
          ${e.candidates?.length > 4 ? `<div class="cand-mini-avatar" style="background:var(--text-3)">+${e.candidates.length - 4}</div>` : ''}
        </div>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════
//  ELECTION DETAIL
// ══════════════════════════════════════════════

async function renderElectionDetail(id) {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="layout">
      ${sidebar()}
      <div class="content" id="detail-content">
        <div class="loading-state"><div class="loading-spinner"></div><br>Loading election...</div>
      </div>
    </div>`;
  try {
    const e = await api(`/elections/${id}`);
    const status = getStatus(e);
    renderDetailContent(e, status);
  } catch(err) {
    document.getElementById('detail-content').innerHTML = `<div class="error-box">⚠ ${err.message}</div>`;
  }
}

function renderDetailContent(e, status) {
  const total = e.totalVotes || 0;
  const isLive = status === 'active';
  const canVote = isLive && !e.hasVoted;

  document.getElementById('detail-content').innerHTML = `
    <button class="btn btn-ghost btn-sm" style="margin-bottom:1rem" onclick="navigate('home')">← Back</button>
    <div class="e-detail">
      <div class="e-detail-header">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
          <span class="badge badge-${status}">${status}</span>
          ${e.featured ? '<span class="badge badge-featured">⭐ Featured</span>' : ''}
          ${e.hasVoted ? '<span class="badge badge-voted">✓ Voted</span>' : ''}
          <span class="badge" style="background:var(--cream);color:var(--text-2)">${e.category}</span>
        </div>
        <h1 class="e-detail-title">${e.title}</h1>
        <div class="e-detail-meta">
          <div class="meta-chip">📅 ${fmtDate(e.startDate)} → ${fmtDate(e.endDate)}</div>
          <div class="meta-chip">👁 ${e.viewCount} views</div>
          <div class="meta-chip">🗳 ${total} votes cast</div>
          ${isLive ? `<div class="meta-chip countdown">⏱ ${countdown(e.endDate)}</div>` : ''}
        </div>
        ${e.description ? `<p style="color:var(--text-2);font-size:15px;line-height:1.7;max-width:680px">${e.description}</p>` : ''}
        ${e.tags?.length ? `<div class="tags-row" style="margin-top:10px">${e.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
      </div>
      <hr class="divider"/>
      <h2 class="section-title">Candidates</h2>
      ${canVote ? '<p style="color:var(--text-3);font-size:13px;margin-bottom:1rem">Select a candidate to cast your vote.</p>' : ''}
      <div class="candidates-grid" id="cands-grid">
        ${e.candidates.map((c, i) => candidateCard(c, e, i, total, canVote)).join('')}
      </div>
      ${canVote ? `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:2rem">
          <button class="btn btn-gold" id="vote-btn" onclick="castVote('${e._id}')" disabled>
            Select a candidate first
          </button>
          <span id="vote-hint" class="text-muted text-sm"></span>
        </div>` : ''}
      ${(status === 'ended' || e.hasVoted) ? resultsSection(e, total) : ''}
      <hr class="divider"/>
      <div id="comments-section"></div>
    </div>`;
  loadComments(e._id);
  if (isLive) startCountdownTicker(e.endDate);
}

function candidateCard(c, e, i, total, canVote) {
  const pct = total > 0 ? ((c.votes / total) * 100).toFixed(1) : 0;
  const isSelected = selectedCandidate[e._id] === c._id;
  const isVotedFor = e.votedFor === c._id.toString();
  const isLeader = i === 0 && total > 0;

  return `
    <div class="cand-card ${isSelected ? 'selected' : ''} ${isLeader && (e.hasVoted || getStatus(e) === 'ended') ? 'winner' : ''}"
         id="cand-${c._id}"
         onclick="${canVote ? `selectCand('${e._id}','${c._id}')` : ''}">
      ${isLeader && (e.hasVoted || getStatus(e) === 'ended') ? '<div class="winner-crown">👑</div>' : ''}
      <div class="selected-check">✓</div>
      <div class="cand-avatar-lg" style="background:${avatarColors[i % avatarColors.length]}">${initials(c.name)}</div>
      <div class="cand-name">${c.name}</div>
      ${c.party ? `<div class="cand-party">${c.party}</div>` : ''}
      ${c.bio ? `<div class="cand-bio">${c.bio.slice(0, 80)}${c.bio.length > 80 ? '...' : ''}</div>` : ''}
      ${(e.hasVoted || getStatus(e) === 'ended') ? `
        <div class="cand-votes">${c.votes}</div>
        <div class="cand-pct">${pct}% of votes</div>
        <div class="result-bar-bg" style="margin-top:8px">
          <div class="result-bar ${barColors[i % barColors.length]}" style="width:${pct}%"></div>
        </div>` : ''}
      ${isVotedFor ? '<div style="margin-top:8px;font-size:12px;color:var(--emerald);font-weight:700">✓ Your vote</div>' : ''}
    </div>`;
}

function selectCand(electionId, candidateId) {
  selectedCandidate[electionId] = candidateId;
  document.querySelectorAll('.cand-card').forEach(c => c.classList.remove('selected'));
  document.getElementById(`cand-${candidateId}`)?.classList.add('selected');
  const btn = document.getElementById('vote-btn');
  if (btn) { btn.disabled = false; btn.textContent = 'Cast Vote →'; }
}

async function castVote(electionId) {
  const candidateId = selectedCandidate[electionId];
  if (!candidateId) return;
  const btn = document.getElementById('vote-btn');
  btn.disabled = true; btn.textContent = 'Casting vote...';
  try {
    await api(`/elections/${electionId}/vote`, { method: 'POST', body: JSON.stringify({ candidateId }) });
    toast('🗳 Vote cast successfully!');
    // Re-render with results
    const e = await api(`/elections/${electionId}`);
    renderDetailContent(e, getStatus(e));
  } catch(e) {
    toast(e.message, 'error');
    btn.disabled = false; btn.textContent = 'Cast Vote →';
  }
}

function resultsSection(e, total) {
  const sorted = [...e.candidates].sort((a, b) => b.votes - a.votes);
  return `
    <hr class="divider"/>
    <h2 class="section-title">📊 Results</h2>
    <div style="font-size:13px;color:var(--text-3);margin-bottom:1rem">Total votes cast: <strong style="color:var(--text)">${total}</strong></div>
    <div class="results-list">
      ${sorted.map((c, i) => {
        const pct = total > 0 ? ((c.votes / total) * 100).toFixed(1) : 0;
        return `
          <div class="result-item">
            <div class="result-row">
              <div class="result-name">${i === 0 && total > 0 ? '👑 ' : ''}${c.name} ${c.party ? `<span class="text-muted text-sm">· ${c.party}</span>` : ''}</div>
              <div class="result-stats">
                <span class="result-votes">${c.votes}</span>
                <span class="result-pct">${pct}%</span>
              </div>
            </div>
            <div class="result-bar-bg">
              <div class="result-bar ${barColors[i % barColors.length]}" style="width:${pct}%"></div>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

function startCountdownTicker(endDate) {
  const els = document.querySelectorAll('.countdown');
  const tick = () => { els.forEach(el => { el.textContent = '⏱ ' + countdown(endDate); }); };
  const id = setInterval(() => { if (!document.querySelector('.countdown')) { clearInterval(id); return; } tick(); }, 60000);
}

async function loadComments(electionId) {
  const section = document.getElementById('comments-section');
  if (!section) return;
  try {
    const comments = await api(`/elections/${electionId}/comments`);
    section.innerHTML = `
      <div class="comment-box">
        <div class="comment-header">
          <span>💬 Discussion (${comments.length})</span>
        </div>
        <div class="comment-input-wrap">
          <div class="user-avatar">${initials(me.name)}</div>
          <textarea class="comment-input" id="comment-input" rows="2" placeholder="Share your thoughts..." maxlength="500"></textarea>
          <button class="btn btn-ink btn-sm" onclick="postComment('${electionId}')">Post</button>
        </div>
        <div class="comment-list" id="comment-list">
          ${comments.length ? comments.map(c => commentHtml(c)).join('') : '<div style="padding:2rem;text-align:center;color:var(--text-3)">Be the first to comment!</div>'}
        </div>
      </div>`;
  } catch {}
}

function commentHtml(c) {
  const liked = c.likes?.includes(me?.id);
  return `
    <div class="comment-item" id="comment-${c._id}">
      <div class="user-avatar" style="flex-shrink:0">${initials(c.user?.name || '?')}</div>
      <div class="comment-body">
        <div class="comment-meta">
          <span class="comment-author">${c.user?.name || 'Unknown'}</span>
          <span class="role-tag role-${c.user?.role || 'voter'}" style="font-size:9px">${c.user?.role || 'voter'}</span>
          <span>${fmtDateTime(c.createdAt)}</span>
        </div>
        <div class="comment-text">${c.text}</div>
        <div class="comment-actions">
          <button class="comment-action-btn ${liked ? 'liked' : ''}" onclick="likeComment('${c._id}')">
            ♥ ${c.likes?.length || 0}
          </button>
          ${(me?.role === 'admin' || c.user?._id === me?.id) ? `<button class="comment-action-btn" onclick="deleteComment('${c._id}', '${c.election || window._pageData}')">🗑 Delete</button>` : ''}
        </div>
      </div>
    </div>`;
}

async function postComment(electionId) {
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  if (!text) return;
  try {
    const c = await api(`/elections/${electionId}/comments`, { method: 'POST', body: JSON.stringify({ text }) });
    input.value = '';
    const list = document.getElementById('comment-list');
    list.insertAdjacentHTML('afterbegin', commentHtml(c));
    toast('Comment posted!');
  } catch(e) { toast(e.message, 'error'); }
}

async function likeComment(commentId) {
  try {
    const d = await api(`/comments/${commentId}/like`, { method: 'POST' });
    const btn = document.querySelector(`#comment-${commentId} .comment-action-btn`);
    if (btn) { btn.classList.toggle('liked'); btn.innerHTML = `♥ ${d.likes}`; }
  } catch {}
}

async function deleteComment(commentId, electionId) {
  if (!confirm('Delete this comment?')) return;
  try {
    await api(`/comments/${commentId}`, { method: 'DELETE' });
    document.getElementById(`comment-${commentId}`)?.remove();
    toast('Comment deleted.');
  } catch(e) { toast(e.message, 'error'); }
}

async function submitElection() {
  const title = document.getElementById('el-title').value.trim();
  const description = document.getElementById('el-desc').value.trim();
  const category = document.getElementById('el-cat').value;
  const startDate = document.getElementById('el-start').value;
  const endDate = document.getElementById('el-end').value;
  const tags = document.getElementById('el-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  const featured = document.getElementById('el-featured').checked;
  const isPublic = document.getElementById('el-public').checked;
  const candidates = adminCands.filter(c => c.name.trim());

  if (!title || !startDate || !endDate || candidates.length < 2) {
    document.getElementById('create-err').innerHTML = `<div class="error-box">⚠ Fill all required fields and add at least 2 candidates.</div>`;
    return;
  }
  try {
    await api('/elections', { method: 'POST', body: JSON.stringify({ title, description, category, startDate, endDate, candidates, tags, featured, isPublic }) });
    toast('🎉 Election created successfully!');
    navigate('admin-elections');
  } catch(e) {
    document.getElementById('create-err').innerHTML = `<div class="error-box">⚠ ${e.message}</div>`;
  }
}

async function renderAdminElections() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="layout">
      ${sidebar()}
      <div class="content">
        <div class="page-hero"><h1>Manage Elections</h1></div>
        <div style="margin-bottom:1rem"><button class="btn btn-gold btn-sm" onclick="navigate('admin-create')">+ Create New</button></div>
        <div id="admin-elections-list"><div class="loading-state"><div class="loading-spinner"></div></div></div>
      </div>
    </div>`;
  try {
    const elections = await api('/elections');
    document.getElementById('admin-elections-list').innerHTML = `
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Title</th><th>Status</th><th>Category</th><th>Candidates</th><th>Votes</th><th>Views</th><th>Actions</th></tr></thead>
          <tbody>
            ${elections.map(e => {
              const total = e.candidates?.reduce((s,c)=>s+c.votes,0)||0;
              return `
              <tr>
                <td><strong>${e.title}</strong><br><span class="text-xs text-muted">${fmtDate(e.startDate)} → ${fmtDate(e.endDate)}</span></td>
                <td><span class="badge badge-${getStatus(e)}">${getStatus(e)}</span></td>
                <td><span class="tag">${e.category}</span></td>
                <td>${e.candidates?.length||0}</td>
                <td class="mono">${total}</td>
                <td class="mono">${e.viewCount||0}</td>
                <td>
                  <div style="display:flex;gap:6px">
                    <button class="btn btn-outline btn-sm" onclick="navigate('election','${e._id}')">View</button>
                    <button class="btn btn-crimson btn-sm" onclick="deleteElection('${e._id}')">Delete</button>
                  </div>
                </td>
              </tr>`}).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteElection(id) {
  if (!confirm('Delete this election and all its votes? This cannot be undone.')) return;
  try {
    await api(`/elections/${id}`, { method: 'DELETE' });
    toast('Election deleted.');
    renderAdminElections();
  } catch(e) { toast(e.message, 'error'); }
}

// ══════════════════════════════════════════════
//  ADMIN USERS
// ══════════════════════════════════════════════

async function renderAdminUsers() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="layout">
      ${sidebar()}
      <div class="content">
        <div class="page-hero"><h1>User Management</h1></div>
        <div class="filter-bar" style="margin-bottom:1.5rem">
          <div class="search-wrap"><span class="search-icon">🔍</span><input id="user-search" placeholder="Search by name or email..." oninput="debounceUserSearch()"/></div>
          <select class="filter-select" id="user-role-filter" onchange="loadUsers()">
            <option value="">All Roles</option>
            <option value="voter">Voters</option>
            <option value="admin">Admins</option>
          </select>
        </div>
        <div id="users-table"><div class="loading-state"><div class="loading-spinner"></div></div></div>
      </div>
    </div>`;
  await loadUsers();
}

let userSearchTimer;
function debounceUserSearch() { clearTimeout(userSearchTimer); userSearchTimer = setTimeout(loadUsers, 350); }

async function loadUsers() {
  const search = document.getElementById('user-search')?.value || '';
  const role = document.getElementById('user-role-filter')?.value || '';
  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (role) params.set('role', role);
  try {
    const users = await api('/admin/users?' + params);
    document.getElementById('users-table').innerHTML = `
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>User</th><th>Role</th><th>Votes Cast</th><th>Joined</th><th>Last Login</th><th>Actions</th></tr></thead>
          <tbody>
            ${users.map(u => `
              <tr>
                <td>
                  <div style="display:flex;align-items:center;gap:8px">
                    <div class="user-avatar" style="width:32px;height:32px;font-size:11px">${initials(u.name)}</div>
                    <div><div style="font-weight:600">${u.name}</div><div class="text-xs text-muted">${u.email}</div></div>
                  </div>
                </td>
                <td><span class="role-tag role-${u.role}">${u.role}</span></td>
                <td class="mono">${u.voteCount || 0}</td>
                <td class="text-sm text-muted">${fmtDate(u.createdAt)}</td>
                <td class="text-sm text-muted">${u.lastLogin ? fmtDateTime(u.lastLogin) : 'Never'}</td>
                <td>
                  <div style="display:flex;gap:6px">
                    <button class="btn btn-outline btn-sm" onclick="toggleBan('${u._id}', ${u.isBanned})">${u.isBanned ? 'Unban' : 'Ban'}</button>
                    ${u._id !== me?.id ? `<button class="btn btn-crimson btn-sm" onclick="deleteUser('${u._id}')">Delete</button>` : ''}
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) { toast(e.message, 'error'); }
}

async function toggleBan(userId, isBanned) {
  try {
    await api(`/admin/users/${userId}`, { method: 'PUT', body: JSON.stringify({ isBanned: !isBanned }) });
    toast(isBanned ? 'User unbanned.' : 'User banned.');
    loadUsers();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteUser(userId) {
  if (!confirm('Delete this user permanently?')) return;
  try {
    await api(`/admin/users/${userId}`, { method: 'DELETE' });
    toast('User deleted.');
    loadUsers();
  } catch(e) { toast(e.message, 'error'); }
}

async function renderAdminActivity() {
  const root = document.getElementById('root');
  root.innerHTML = `
    <div class="layout">
      ${sidebar()}
      <div class="content">
        <div class="page-hero"><h1>Activity Log</h1><p>Recent platform activity.</p></div>
        <div id="activity-log"><div class="loading-state"><div class="loading-spinner"></div></div></div>
      </div>
    </div>`;
  try {
    const activities = await api('/admin/activity');
    const actionIcons = { login:'🔑', register:'👤', vote:'🗳', create_election:'➕' };
    document.getElementById('activity-log').innerHTML = `
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>User</th><th>Action</th><th>Details</th><th>When</th></tr></thead>
          <tbody>
            ${activities.map(a => `
              <tr>
                <td>
                  <div style="display:flex;align-items:center;gap:8px">
                    <div class="user-avatar" style="width:28px;height:28px;font-size:10px">${initials(a.user?.name||'?')}</div>
                    ${a.user?.name||'Unknown'}
                  </div>
                </td>
                <td>${actionIcons[a.action]||'📌'} ${a.action}</td>
                <td class="text-sm text-muted">${a.details||'—'}</td>
                <td class="text-sm text-muted">${fmtDateTime(a.createdAt)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch(e) { toast(e.message, 'error'); }
}
